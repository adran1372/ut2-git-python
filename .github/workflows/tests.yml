name: Tests
on:
push:
branches: [ main ]
pull_request:
branches: [ fix-issue-1]
jobs:
test:
runs-on: ubuntu-latest
steps:
- name: Descargar el código del repositorio
uses: actions/checkout@v4
- name: Instalar Python
uses:probar ejercicios
with:
python-version: "3.13"
- name: Ejecutar cada ejercicio con una entrada de prueba
run: |
echo "4" | python3 ej01_par_impar.py
echo "8.5" | python3 ej02_calificacion.py
